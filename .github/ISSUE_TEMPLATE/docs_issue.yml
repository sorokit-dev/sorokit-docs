name: Documentation issue
description: Something is missing, unclear, or wrong in the docs
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where?
      description: Page, section, or file that has the problem.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
    validations:
      required: false
